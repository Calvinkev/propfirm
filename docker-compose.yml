version: '3.8'

services:
  # ── MySQL Database ────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: stakeup-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-stakeup_root_2024}
      MYSQL_DATABASE: ${DB_NAME:-stakeup}
      MYSQL_USER: ${DB_USER:-stakeup}
      MYSQL_PASSWORD: ${DB_PASSWORD:-stakeup_secure_pwd}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-stakeup_root_2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - stakeup-net

  # ── Backend API Server ───────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: stakeup-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_USER: ${DB_USER:-stakeup}
      DB_PASSWORD: ${DB_PASSWORD:-stakeup_secure_pwd}
      DB_NAME: ${DB_NAME:-stakeup}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_THIS_IN_PRODUCTION_$(openssl rand -hex 32)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      METAAPI_TOKEN: ${METAAPI_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - stakeup-net

  # ── Frontend Dev Server (development only) ────────────────────────────────
  # Uncomment for local development with hot-reload.
  # In production, the frontend is served statically from the backend container.
  # frontend:
  #   image: node:20-alpine
  #   container_name: stakeup-frontend
  #   working_dir: /app
  #   volumes:
  #     - .:/app
  #     - /app/node_modules
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     VITE_API_URL: http://localhost:5000/api
  #   command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
  #   networks:
  #     - stakeup-net

volumes:
  mysql_data:
    driver: local

networks:
  stakeup-net:
    driver: bridge
